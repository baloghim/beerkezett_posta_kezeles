name: Windows kiadás
on:
  push:
    branches: [main, work]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      validate_windows1607:
        description: 'Külön, tényleges Windows 10 1607 x64 self-hosted tesztgép használata'
        type: boolean
        default: false
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Utolsó hivatalos 3.10-es Windows installer; Windows 8.1+ alap.
          python-version: '3.10.11'
          architecture: x64
          cache: pip
      - name: Rögzített függőségek (Qt 5, kizárólag bináris natív csomagok)
        run: |
          python -m pip install pip==24.3.1
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip install -e ".[dev]"
      - name: Automatikus tesztek (csak ideiglenes adatok)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/ci_run.py python -m pytest -q --junitxml=test-results.xml
      - name: Önálló Windows x64 alkalmazás
        run: python scripts/ci_run.py python -m PyInstaller --noconfirm --clean EDPD-Manager.spec
      - name: Natív DLL-leltár és statikus kompatibilitási ellenőrzés
        run: |
          python scripts/ci_run.py python scripts/audit_windows_binary.py dist/EDPD-Manager --report native-dependencies.json
          python scripts/ci_run.py python scripts/check_packaged_icons.py dist/EDPD-Manager --report icon-audit.json
      - name: Csomagolt EXE valódi indítása a modern runneren
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          trap { Write-Output ('::error title=EXE önellenőrzési hiba::' + $_.Exception.Message); exit 1 }
          $report = Join-Path $pwd 'modern-runner-selftest.json'
          $process = Start-Process dist/EDPD-Manager/EDPD-Manager.exe -ArgumentList @('--self-test', '--report', ('"' + $report + '"')) -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'EXE indítási időtúllépés' }
          $process.Refresh()
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) { throw ('Az EXE indítási próbája sikertelen. ExitCode=' + $process.ExitCode + '; report=' + (Test-Path $report)) }
          $result = Get-Content -Raw $report | ConvertFrom-Json
          if (-not $result.passed -or -not $result.host.frozen) { throw ('Hibás csomagolt önellenőrzés: ' + (Get-Content -Raw $report)) }
          $expectedVersion = python -c "from edpd import __version__; print(__version__)"
          if ($result.application_version -ne $expectedVersion -or $result.checks.Count -lt 14) { throw 'Eltérő verzió vagy hiányos EDPD önellenőrzés' }
          # A modern runner eredménye nem 1607 kompatibilitási bizonyíték.
          if ($result.windows1607_verified) { throw 'Hibás OS-minősítés a modern runneren' }
      - name: Csomagolt EXE dupla indítás, helyreállás és indulási idő mérése
        run: python scripts/ci_run.py python scripts/check_startup.py dist/EDPD-Manager/EDPD-Manager.exe --report startup-validation.json
      - name: Csomagolás
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE dist/EDPD-Manager/
          Copy-Item docs/WINDOWS-VALIDATION.md, docs/WINDOWS1607.md, docs/STARTUP.md, docs/ICON-THEMES.md, docs/icon-theme-comparison.png dist/EDPD-Manager/
          Copy-Item scripts/Test-Windows1607.ps1 dist/EDPD-Manager/
          Copy-Item modern-runner-selftest.json, native-dependencies.json, icon-audit.json, test-results.xml, startup-validation.json dist/EDPD-Manager/
          Compress-Archive -Path dist/EDPD-Manager -DestinationPath EDPD-Manager-Windows-x64.zip
          (Get-FileHash EDPD-Manager-Windows-x64.zip -Algorithm SHA256).Hash.ToLower() + '  EDPD-Manager-Windows-x64.zip' | Out-File EDPD-Manager-Windows-x64.zip.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: EDPD-Manager-Windows-x64
          path: |
            EDPD-Manager-Windows-x64.zip
            EDPD-Manager-Windows-x64.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-diagnostics
          path: |
            modern-runner-selftest.json
            native-dependencies.json
            icon-audit.json
            test-results.xml
            startup-validation.json
  # Nem fut PR-ból, és alapból nem vár nem létező runnerre.
  # A konkrét 1607-es vendég OS-t a mellékelt script és az EXE is ellenőrzi.
  windows1607:
    if: github.event_name == 'workflow_dispatch' && inputs.validate_windows1607 && github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, Windows, X64, win10-1607]
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      # Nem használ Node.js alapú actiont a régi vendég OS-en.
      - name: Artifact letöltése és valódi Windows 10 1607 EXE-próba
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $url = 'https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts'
          $artifacts = Invoke-RestMethod -Uri $url -Headers $headers
          $artifact = @($artifacts.artifacts | Where-Object { $_.name -eq 'EDPD-Manager-Windows-x64' -and -not $_.expired })
          if ($artifact.Count -ne 1) { throw 'Current build artifact not found or ambiguous.' }
          $testRoot = Join-Path $env:RUNNER_TEMP ([Guid]::NewGuid().ToString())
          New-Item -ItemType Directory $testRoot | Out-Null
          $download = Join-Path $testRoot 'artifact.zip'
          Invoke-WebRequest -UseBasicParsing -Headers $headers -Uri $artifact[0].archive_download_url -OutFile $download
          Expand-Archive $download (Join-Path $testRoot 'download')
          $zip = Join-Path $testRoot 'download/EDPD-Manager-Windows-x64.zip'
          $expected = ((Get-Content ($zip + '.sha256') -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Package checksum mismatch.' }
          Expand-Archive $zip (Join-Path $testRoot 'unpacked')
          $app = Join-Path $testRoot 'unpacked/EDPD-Manager'
          $report = Join-Path $testRoot 'windows1607-selftest.json'
          & (Join-Path $app 'Test-Windows1607.ps1') -ApplicationDirectory $app -ReportPath $report
          Get-Content $report -Raw | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EDPD-Manager-Windows-x64
          path: release
      - name: Verziózott GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' "EDPD $RELEASE_TAG – öt azonnal váltható ikontéma, finomított PDF-eszköztár, Dátum–Fájlnév–Méret lista, korai indítóképernyő és felhasználói munkamenetenként egy programpéldány." 'Változatlan Windows 10 1607 x64 technológiai alap: Python 3.10.11, Qt 5.15.2 / PySide2 5.15.2.1, PyMuPDF 1.23.26.' 'A Windows build, a tesztek, az öt ikontéma erőforrás-auditja, a csomagolt EXE önellenőrzése, 11 valódi folyamatindítási ellenőrzés és a statikus DLL-vizsgálat a kiadást készítő workflow részei. Részletes időmérések: startup-validation.json a ZIP-ben. A célgépes Windows 10 1607 és többfelhasználós munkahelyi próba külön szükséges.' > release-notes.txt
          gh release create "$RELEASE_TAG" release/EDPD-Manager-Windows-x64.zip release/EDPD-Manager-Windows-x64.zip.sha256 --verify-tag --notes-file release-notes.txt --title "EDPD $RELEASE_TAG"
