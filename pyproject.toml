[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "edpd-manager"
version = "0.1.0"
description = "EDPD – Postai dokumentumkezelő"
requires-python = ">=3.12"
dependencies = ["PySide6==6.8.3", "PyMuPDF==1.25.5"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pyinstaller==6.12.0"]

[project.scripts]
edpd-manager = "edpd.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
