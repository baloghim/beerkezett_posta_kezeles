[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "edpd-manager"
version = "2.6.3"
description = "EDPD Menedzser"
requires-python = ">=3.10,<3.11"
dependencies = ["PySide2==5.15.2.1", "PyMuPDF==1.23.26"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pyinstaller==6.12.0", "pyinstaller-hooks-contrib==2025.1", "pefile==2023.2.7", "setuptools==75.8.2", "wheel==0.45.1"]

[project.scripts]
edpd-manager = "edpd.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
junit_family = "xunit1"

[tool.setuptools.package-data]
edpd = ["assets/*", "assets/*/*", "assets/*/*/*", "assets/*/*/*/*"]
